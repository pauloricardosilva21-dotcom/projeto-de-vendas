<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MalufLoja - Finalizar Compra</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

    <header>
        <div class="logo">MalufLoja</div>
        <a href="index.html" class="btn-voltar">← Voltar para a loja</a>
    </header>

    <main class="container-checkout">
        
        <section class="resumo-pedido">
            <h2>Resumo do Pedido</h2>
            <div class="produto-selecionado">
                <img id="img-produto" src="" alt="Produto">
                <div>
                    <h3 id="nome-produto">Carregando produto...</h3>
                    <p id="preco-produto">R$ 0,00</p>
                </div>
            </div>
            <div class="total-linha">
                <span>Frete:</span>
                <span class="gratis">Grátis</span>
            </div>
            <div class="total-linha total-final">
                <span>Total:</span>
                <span id="total-produto">R$ 0,00</span>
            </div>
        </section>

        <section class="formulario-pagamento">
            <h2>Dados de Pagamento</h2>
            
            <div class="metodos-pagamento">
                <button type="button" class="btn-metodo ativo" onclick="mudarMetodo('pix')">Pix</button>
                <button type="button" class="btn-metodo" onclick="mudarMetodo('cartao')">Cartão de Crédito</button>
            </div>

            <div id="checkout-pix" class="conteudo-pagamento">
                <p>Escaneie o código abaixo para pagar:</p>
                <div class="qr-code-placeholder">
                    <img src="https://gstatic.com" alt="QR Code Fictício">
                </div>
                <input type="text" class="input-pix" value="00020101021226870014br.gov.bcb.pix2565malufloja" readonly>
                <button type="button" class="btn-sucesso" onclick="finalizarCompra()">Copiar Código Pix</button>
            </div>

            <form id="checkout-cartao" class="conteudo-pagamento escondido" onsubmit="event.preventDefault(); finalizarCompra();">
                <div class="grupo-input">
                    <label>Número do Cartão</label>
                    <input type="text" placeholder="0000 0000 0000 0000" required>
                </div>
                <div class="grupo-input">
                    <label>Nome no Cartão</label>
                    <input type="text" placeholder="Como está no cartão" required>
                </div>
                <div class="linha-inputs">
                    <div class="grupo-input">
                        <label>Validade</label>
                        <input type="text" placeholder="MM/AA" required>
                    </div>
                    <div class="grupo-input">
                        <label>CVV</label>
                        <input type="text" placeholder="000" required>
                    </div>
                </div>
                <div class="grupo-input">
                    <label>Parcelas</label>
                    <select id="parcelas-select">
                        <option>1x sem juros</option>
                    </select>
                </div>
                <button type="submit" class="btn-sucesso">Pagar com Cartão</button>
            </form>

        </section>

    </main>

    <script src="checkout.js"></script>
</body>
</html>
